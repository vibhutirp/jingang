rules:
  - id: jingang-ghsa-fvqr-27wr-82fm-call
    message: >-
      Calls lodash $F, which allows prototype pollution in lodash before 4.17.5
      (GHSA-fvqr-27wr-82fm). Exposed only if the lockfile has lodash < 4.17.5.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      advisory: GHSA-fvqr-27wr-82fm
      package: lodash
      kind: reachability
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      const $L = require("lodash");
                      ...
                  - pattern-inside: |
                      import $L from "lodash";
                      ...
                  - pattern-inside: |
                      import * as $L from "lodash";
                      ...
              - pattern: $L.$F(...)
          - patterns:
              - pattern-inside: |
                  import { $F } from "lodash";
                  ...
              - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(merge|mergeWith|defaultsDeep)$
