---
# Akash console deployment: an open model behind an OpenAI-compatible endpoint.
# After the lease starts, the console shows a host and port for "api";
# set AKASHML_BASE_URL=http://<host>:<port>/v1 and AKASHML_MODEL=qwen2.5:3b.
version: "2.0"

services:
  llm:
    image: ollama/ollama:latest
    command:
      - sh
      - -c
    args:
      - "ollama serve & sleep 8 && ollama pull qwen2.5:3b && wait"
    env:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    expose:
      - port: 11434
        as: 80
        to:
          - global: true

profiles:
  compute:
    llm:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
          size: 20Gi
  placement:
    dcloud:
      pricing:
        llm:
          denom: uakt
          amount: 10000

deployment:
  llm:
    dcloud:
      profile: llm
      count: 1
